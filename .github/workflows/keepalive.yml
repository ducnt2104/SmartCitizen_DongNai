name: Render Keep-Alive Ping

# Giữ Render Free Web Service luôn ấm (tránh ngủ sau 15 phút không truy cập),
# giúp Googlebot & người dân truy cập tức thì.
# Lưu ý: GitHub Actions miễn phí không giới hạn với repo Public; nếu repo ở chế độ Private,
# có thể tắt workflow này và dùng Cron-job.org / UptimeRobot miễn phí để không tốn phút Private Runner.
on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping SmartCitizen Đồng Nai healthz endpoint
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://smartcitizen-dongnai.onrender.com/healthz || echo "000")
          echo "HTTP status from /healthz: $code"
          if [ "$code" != "200" ]; then
            sleep 5
            curl -fsS --max-time 45 https://smartcitizen-dongnai.onrender.com/healthz
          fi
