services:
  - type: web
    name: smartcitizen-dongnai
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: npm install --include=dev --prefix backend && npm install --include=dev --prefix frontend && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render tự động sinh chuỗi ngẫu nhiên an toàn (>= 32 ký tự)
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: KEY_ENCRYPTION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      # Các khóa bí mật bắt buộc nhập trực tiếp trên Render Dashboard (không lưu trong Git)
      - key: MONGODB_URI
        sync: false
      - key: ALLOW_JSON_FALLBACK
        value: "false"
      - key: AUTO_SEED_DEMO_REPORTS
        value: "false"
      - key: ALLOW_CLOUD_AI_FALLBACK
        value: "true"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Tài khoản SUPER_ADMIN & Cán bộ IOC Khởi tạo (đổi mật khẩu trên Render Dashboard)
      - key: SUPER_ADMIN_CODE
        value: SUPER-ADMIN
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@dongnai.gov.vn
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_STAFF_PASSWORD
        sync: false
      # Dịch vụ gửi OTP Email & SMS qua HTTPS Port 443
      - key: OTP_PROVIDER
        value: auto
      - key: SMS_PROVIDER
        value: auto
      - key: ALLOW_DEMO_OTP
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
      - key: TEXTBEE_API_KEY
        sync: false
      - key: SMS_GATEWAY_URL
        sync: false
      - key: SMS_GATEWAY_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OTP_WEBHOOK_URL
        sync: false
      - key: OTP_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://*.onrender.com
      - key: REPORTS_PER_HOUR
        value: "3"
      - key: AI_VISION_PER_HOUR
        value: "10"
      # Google Maps Platform cho Frontend (bật Maps JavaScript API, Places API, Geocoding API; có MapLibre fallback)
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: DATA_DIR
        value: ./data
