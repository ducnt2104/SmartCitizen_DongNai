services:
  - type: web
    name: smartcitizen-dongnai
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: npm install --include=dev --prefix server && npm install --include=dev --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render tự động sinh chuỗi ngẫu nhiên an toàn (>= 32 ký tự)
      - key: JWT_SECRET
        generateValue: true
      # Các khóa bí mật bắt buộc nhập trực tiếp trên Render Dashboard (không lưu trong Git)
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://*.onrender.com
      - key: DEMO_OTP
        value: "true"
      - key: ENABLE_DEMO_AUTH
        value: "true"
      - key: REPORTS_PER_HOUR
        value: "3"
      - key: AI_VISION_PER_HOUR
        value: "10"
      - key: DATA_DIR
        value: ./data
