services:
  - type: web
    name: smartcitizen-dongnai
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: npm install --include=dev --prefix backend && npm install --include=dev --prefix frontend && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render tự động sinh chuỗi ngẫu nhiên an toàn (>= 32 ký tự)
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      # Các khóa bí mật bắt buộc nhập trực tiếp trên Render Dashboard (không lưu trong Git)
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # Dịch vụ gửi OTP thật qua HTTPS Port 443 (Render Free Tier chặn cổng SMTP 25/465/587)
      - key: OTP_PROVIDER
        value: auto
      - key: OTP_WEBHOOK_URL
        sync: false
      - key: OTP_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Mật khẩu khởi tạo Cán bộ IOC 2 cấp (đổi trên Render Dashboard)
      - key: INITIAL_STAFF_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://*.onrender.com
      - key: REPORTS_PER_HOUR
        value: "3"
      - key: AI_VISION_PER_HOUR
        value: "10"
      # Google Maps Platform cho Frontend (bật Maps JavaScript API, Places API, Geocoding API; có MapLibre fallback)
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: DATA_DIR
        value: ./data
